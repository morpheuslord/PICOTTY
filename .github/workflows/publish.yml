# Upload the `picotty` package to PyPI when a GitHub Release is published.
# Adapted from GitHub's official "Upload Python Package" template — the build step
# uses uv against the hub/ src layout (and bundles the dashboard's vendored assets)
# instead of `python -m build` at the repo root.
#
# ONE-TIME SETUP — PyPI Trusted Publishing (no long-lived token):
#   1. PyPI (owner: morpheus_lord) -> project `picotty` -> Publishing -> add a
#      trusted publisher:
#        owner/repo  : morpheuslord/PICOTTY
#        workflow    : publish.yml
#        environment : pypi
#      (Before the first upload use a "pending publisher" since the project
#       doesn't exist on PyPI yet.)
#   2. GitHub -> Settings -> Environments -> create an environment named `pypi`
#      (add deployment protection rules if you want a manual approval gate).
# Then: draft a GitHub Release named v1.0.0 and Publish it — this workflow builds
# and uploads the distributions, and the release links to the PyPI project.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    name: Build distributions (uv)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the built wheel + sdist to the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.13"
          python-version: "3.11"

      # The wheel ships the dashboard; the vendored terminal libs (xterm,
      # asciinema) are gitignored, so fetch them before building or the wheel
      # ships without a working console.
      - name: Fetch vendored assets
        run: bash hub/src/picotty/static/vendor/fetch-vendor.sh

      - name: Build release distributions
        working-directory: hub
        run: uv build   # -> hub/dist/*.whl + *.tar.gz

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: hub/dist/

      # Attach the wheel + sdist to the GitHub Release page so they're downloadable
      # right there (Python packages don't appear under the repo's Packages menu —
      # that registry has no PyPI; the Release assets are the GitHub-side artifact).
      - name: Attach distributions to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" hub/dist/* --clobber

  pypi-publish:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environment with protections for publishing (create it under
    # Settings -> Environments), and referenced by the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/picotty

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
